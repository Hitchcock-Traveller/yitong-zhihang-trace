    if(h==='#'||h==='＃')continue;
    if(h.indexOf('类型')>=0)continue;
    if(h.indexOf('来源')>=0||h.indexOf('出处')>=0||h.indexOf('方法')>=0||h.indexOf('依据')>=0){
      source=v;
    }else{
      content+=(content?'，':'')+v;
    }
  }
  return {content:content,source:source};
}

var SECTIONS = [["一、市场数据", "市场数据", "#2563eb"], ["二、法规", "法规", "#16a34a"], ["三、政策与标准", "政策与标准", "#ea580c"], ["四、竞品参数", "竞品参数", "#7c3aed"], ["八、窗口3", "其他", "#6b7280"]];
var PAPERS = [["SkyShield：低空 UAV 3D 占据防撞", "厦门大学", "单目 RGB 视锥内 3D 语义占据", "https://arxiv.org/abs/2606.00747"], ["UNSEEN：纯视觉无人机全链路不确定性导航", "特伦托大学", "V-SLAM、概率占据栅格、RRT* 滚动规划", "https://arxiv.org/abs/2606.20755"], ["OKVIS2-X：多传感器 SLAM 统一框架", "", "关键帧因子图统一视觉、IMU、LiDAR、GNSS", "https://arxiv.org/abs/2510.04612"], ["MIGHTY：无人机轨迹规划器", "MIT、宾大", "五次 Hermite 样条轨迹优化，IEEE RA-L", "https://github.com/mit-acl/mighty"], ["CSF：LiDAR 点云地面分割", "中山大学、帝国理工", "布料模拟滤波，Remote Sensing 2016", "https://www.mdpi.com/2072-4292/8/3/140"], ["LidarVerse：实时统一 LiDAR 世界模型", "NVIDIA", "统一 tokenizer、双向教师、自回归学生", "https://arxiv.org/abs/2610.19201"], ["PointEvent：事件相机反无人机微小目标检测", "南京理工、厦大", "事件相机加序列化运动证据累积", "https://arxiv.org/abs/2609.20066"], ["Bee-Nav：仿生蜜蜂归航导航", "代尔夫特理工", "不建图、不用 GPS 的视觉归航，Nature", "https://www.nature.com/articles/s41586-026-10461-3"], ["FARM：关系型空间记忆", "Berkeley、Stanford", "物体级空间记忆加自然语言检索导航", "https://arxiv.org/abs/2606.15476"], ["DynamicVGGT：动态 4D 重建", "", "VGGT 扩展，CVPR 2026", "https://arxiv.org/abs/2603.08254"], ["SkyJEPA：零样本 Sim2Real 控制世界模型", "UC Berkeley、NYU、Brown", "JEPA 潜空间动力学加 MPPI 控制", "https://arxiv.org/abs/2606.23444"], ["PS-LOS：长距离反无人机拦截", "北航", "ICRA 2026 最佳论文", "https://arxiv.org/abs/2606.10639"], ["ego-planner：ESDF-free 局部规划器", "HKUST/ZJU FAST Lab", "B 样条加碰撞梯度推离障碍", "https://arxiv.org/abs/2008.06532"], ["MINCO：轨迹优化体系", "高飞", "分段多项式时空联合优化", "https://arxiv.org/abs/2103.00190"]];

function build(){
  var srcTotal=0;
  var html='';
  var tocHtml='';

  SECTIONS.forEach(function(sec,idx){
    var prefix=sec[0], title=sec[1], color=sec[2];
    var led = DATA.evidence_ledger.filter(function(e){return e.section.indexOf(prefix)===0;});
    if(led.length===0)return;
    var items='';
    var count=0;
    led.forEach(function(e){
      (e.rows||[]).forEach(function(r){
        if(isDeleted(r))return;
        var lo=locate(e.headers||[],r);
        if(!lo.content)return;
        items+='<div class="src"><div class="t">'+cell(lo.content)+'</div>';
        if(lo.source)items+='<div class="s">'+cell(lo.source)+'</div>';
        items+='</div>';
        count++;
      });
    });
    if(items){
      html+='<div class="block" id="sec-'+idx+'"><h2 style="border-left-color:'+color+'">'+esc(title)+'</h2>'+items+'</div>';
      tocHtml+='<a href="#sec-'+idx+'">'+esc(title)+'</a>';
      srcTotal+=count;
    }
  });

  html+='<div class="block" id="sec-paper"><h2 style="border-left-color:#1d4ed8">论文与文献</h2>';
  PAPERS.forEach(function(p){
    var name=p[0], org=p[1], desc=p[2], link=p[3];
    html+='<div class="paper"><span class="pn">'+esc(name)+'</span>'+(org?'<span class="po">'+esc(org)+'</span>':'')+' <span class="pw">'+esc(desc)+'</span>'+(link?' <a class="lk" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">'+esc(link.replace(/^https?:\/\//,''))+'</a>':'')+'</div>';
  });
  html+='</div>';
  tocHtml+='<a href="#sec-paper">论文与文献</a>';

  document.getElementById('toc').innerHTML=tocHtml;
  document.getElementById('content').innerHTML=html;

  var linkCount=document.querySelectorAll('#content a[href]').length;
  var stats=[['5','类资料'],[String(srcTotal),'条资料'],[String(PAPERS.length),'篇论文'],[String(linkCount),'个链接']];
  document.getElementById('stats').innerHTML=stats.map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>';}).join('');
}
build();
</script>
